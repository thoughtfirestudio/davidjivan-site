<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arc — Christianity Map | David Jivan</title>
<meta name="description" content="Walk the arc of Christian origins — nine stops from a tribal storm god to the cosmic Christ.">
<link rel="canonical" href="https://davidjivan.net/christianity-map">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/vendor/waves.min.css">
<style>
  /* ── Map page ─────────────────────────────────────────── */
  .map-head {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px var(--pad-x) 0;
  }
  .map-head h1 { font-size: 2rem; font-weight: 400; letter-spacing: -0.01em; color: var(--text-hi); }
  .map-head h1 em { font-style: italic; color: var(--accent); }
  .map-head .sub { font-family: var(--font-ui); font-size: 14px; color: var(--text-dim); margin-top: 6px; }
  .map-head .count { font-family: var(--font-ui); font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 14px; }

  /* ── Spine ────────────────────────────────────────────── */
  .spine-wrap { max-width: 820px; margin: 0 auto; padding: 28px var(--pad-x) 0; }
  .spine-wrap svg { display: block; width: 100%; height: auto; }
  .spine-wrap .node-dot { cursor: pointer; }
  .spine-wrap .node-dot:hover circle.dot { fill: var(--accent); }
  .spine-wrap .node-dot text { font: 600 11px var(--font-ui); fill: var(--text); pointer-events: none; }

  /* ── Node panel ───────────────────────────────────────── */
  .panel {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px var(--pad-x) 80px;
  }
  .panel .node-index {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 14px;
  }
  .panel h2 { font-size: 1.9rem; font-weight: 400; line-height: 1.2; color: var(--text-hi); letter-spacing: -0.01em; margin-bottom: 20px; }
  .panel .thesis {
    font-size: 1.15rem; font-style: italic; color: var(--accent); line-height: 1.6;
    border-left: 2px solid var(--accent-dim); padding-left: 18px; margin-bottom: 34px;
  }
  .panel .ideas-label {
    font-family: var(--font-ui); font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
  }
  .panel .ideas { list-style: none; margin-bottom: 36px; }
  .panel .ideas li {
    padding: 14px 0; border-top: 1px solid var(--border);
    font-size: 1rem; line-height: 1.7; color: var(--text);
  }
  .panel .ideas li:last-child { border-bottom: 1px solid var(--border); }
  .panel .ideas li .lead { color: var(--accent); font-family: var(--font-ui); font-size: 12px; margin-right: 8px; }
  .panel .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel .chips span {
    font-family: var(--font-ui); font-size: 12px; color: var(--text-dim);
    background: var(--surface); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 5px;
  }

  /* ── Nav ──────────────────────────────────────────────── */
  .map-nav {
    max-width: 640px; margin: 0 auto; padding: 0 var(--pad-x) 60px;
    display: flex; gap: 10px; align-items: center;
  }
  .map-nav button {
    font-family: var(--font-ui); font-size: 14px; color: var(--text);
    border: 1px solid var(--border-hi); border-radius: 6px;
    padding: 10px 18px; background: var(--bg); cursor: pointer;
    transition: all var(--dur);
  }
  .map-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .map-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .map-nav button:disabled { opacity: 0.3; cursor: default; }
  .map-nav #next { margin-left: auto; }
  .map-nav .kbd { font-size: 11px; color: var(--text-dim); margin-right: 4px; }
  .map-nav .home-link { font-size: 13px; color: var(--text-dim); margin-left: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .map-nav .home-link:hover { color: var(--text); }

  .node-anim { animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .map-head h1 { font-size: 1.6rem; }
    .panel h2 { font-size: 1.5rem; }
    .panel .thesis { font-size: 1.02rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo"><a href="/" style="color: inherit;">David Jivan</a></div>
  <div class="topbar-url">davidjivan.net/christianity-map</div>
</div>

<div class="map-head">
  <h1>The <em>Arc</em></h1>
  <div class="sub">the intellectual history of Christianity</div>
  <div class="count" id="count"></div>
</div>

<div class="spine-wrap">
  <svg id="spine" viewBox="0 0 820 120" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The arc of Christian origins"></svg>
</div>

<div class="panel" id="panel"></div>

<div class="map-nav">
  <button id="prev"><span class="kbd">&#8592;</span> Previous</button>
  <button id="next">Next <span class="kbd">&#8594;</span></button>
  <a class="home-link" href="/">back to start</a>
</div>

<script src="/vendor/jquery.min.js"></script>
<script src="/vendor/jquery.drawsvg.js"></script>
<script src="/arc-data.js"></script>
<script>
$(function() {
  var NODES = window.ARC.nodes;
  var current = 0;
  var W = 820, H = 120, n = NODES.length;
  var x0 = 70, x1 = W - 70, y = 62;
  var gap = (x1 - x0) / (n - 1);
  var pts = NODES.map(function(_, i) { return { x: x0 + gap * i, y: y + (i % 2 === 0 ? 0 : 26) }; });

  function hashIndex() {
    var m = window.location.hash.match(/^#node-(\d+)$/);
    if (!m) return 0;
    var i = parseInt(m[1], 10) - 1;
    return (i >= 0 && i < n) ? i : 0;
  }

  function drawSpine() {
    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (var i = 1; i < n; i++) {
      var p0 = pts[i-1], p1 = pts[i], mx = (p0.x + p1.x) / 2;
      d += ' C ' + mx + ' ' + p0.y + ', ' + mx + ' ' + p1.y + ', ' + p1.x + ' ' + p1.y;
    }
    var s = '<path d="' + d + '" fill="none" stroke="var(--accent-dim)" stroke-width="2"/>';
    pts.forEach(function(p, i) {
      var filled = i < current, active = i === current, r = active ? 8 : 6;
      s += '<g class="node-dot" data-i="' + i + '">'
        + '<circle cx="' + p.x + '" cy="' + p.y + '" r="20" fill="transparent"/>'
        + '<circle class="dot" cx="' + p.x + '" cy="' + p.y + '" r="' + r + '" fill="' + (active ? 'var(--accent)' : filled ? 'var(--accent-dim)' : 'var(--bg)') + '" stroke="var(--accent)" stroke-width="2"/>'
        + '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle">' + NODES[i].n + '</text>'
        + '</g>';
    });
    $('#spine').html(s);
    $('#spine').drawsvg({ duration: 900, stagger: 60 });
    $('.node-dot').off('click').on('click', function() { goto(parseInt($(this).data('i'), 10)); });
  }

  function render() {
    var node = NODES[current];
    $('#count').text('stop ' + (current + 1) + ' of ' + n);
    $('#panel').html(
      '<div class="node-index">Stop ' + (current + 1) + ' — the arc</div>'
      + '<h2>' + node.name + '</h2>'
      + '<p class="thesis">' + node.thesis + '</p>'
      + '<div class="ideas-label">Big ideas</div>'
      + '<ul class="ideas">' + node.ideas.map(function(idea, i) { return '<li><span class="lead">' + (i + 1) + '.</span>' + idea + '</li>'; }).join('') + '</ul>'
      + '<div class="ideas-label">In the library</div>'
      + '<div class="chips">' + node.chips.map(function(c) { return '<span>' + c + '</span>'; }).join('') + '</div>'
    );
    // re-trigger the reveal animation
    $('#panel').children().each(function(i, el) { $(el).addClass('node-anim'); });
    drawSpine();
    $('#prev').prop('disabled', current === 0);
    $('#next').prop('disabled', current === n - 1).text(current === n - 1 ? 'End' : 'Next \u2192');
    window.location.hash = 'node-' + (current + 1);
  }

  function goto(i) {
    if (i < 0 || i >= n) return;
    current = i;
    render();
  }

  $('#prev').on('click', function() { goto(current - 1); });
  $('#next').on('click', function() { goto(current + 1); });
  $(document).on('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') goto(current - 1);
    if (e.key === 'ArrowRight') goto(current + 1);
    if (e.key === 'Home') goto(0);
    if (e.key === 'End') goto(n - 1);
  });

  current = hashIndex();
  render();

  if (window.Waves) Waves.attach('.node-dot', ['waves-circle']); Waves.init();
});
</script>
<script src="/vendor/waves.min.js"></script>
<script defer src="/track.js"></script>
</body>
</html>
