<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arc — Christianity Map | David Jivan</title>
<meta name="description" content="Walk the arc of Christian origins — nine stops, from storm god to cosmic Christ.">
<link rel="canonical" href="https://davidjivan.net/christianity-map">
<link rel="stylesheet" href="/style.css">
<style>
  /* ── The Arc — map page ─────────────────────────────── */
  .map-head { max-width: 820px; margin: 0 auto; padding: 40px var(--pad-x) 0; }
  .map-head h1 { font-size: 2.1rem; font-weight: 400; letter-spacing: -0.01em; color: var(--text-hi); }
  .map-head h1 em { font-style: italic; color: var(--accent); }
  .map-head .sub { font-family: var(--font-ui); font-size: 14px; color: var(--text-dim); margin-top: 6px; }
  .map-head .gold {
    font-family: var(--font-body); font-size: 1.05rem; font-style: italic;
    color: var(--text); margin-top: 14px;
  }
  .map-head .gold strong { font-style: normal; color: var(--accent); font-weight: 600; }
  .map-head .count { font-family: var(--font-ui); font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; }

  /* ── Horizontal spine (desktop) ─────────────────────── */
  .spine-wrap { max-width: 820px; margin: 0 auto; padding: 26px var(--pad-x) 0; display: none; }
  .spine-wrap svg { display: block; width: 100%; height: auto; }
  .spine-wrap .arc-path { stroke-dasharray: 10 8; animation: flow 1.1s linear infinite; }
  .spine-wrap .node-dot { cursor: pointer; }
  .spine-wrap .node-dot circle.hit { fill: transparent; }
  .spine-wrap .node-dot circle.dot { transition: fill .2s, r .2s; }
  .spine-wrap .node-dot:hover circle.dot { fill: var(--accent); }
  .spine-wrap .node-dot text { font: 600 11px var(--font-ui); fill: var(--text); pointer-events: none; }
  .spine-wrap .node-dot .pulse { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; }
  .spine-wrap .node-dot.active .pulse { opacity: 1; animation: pulse 2.2s ease-out infinite; transform-origin: center; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @keyframes pulse { 0% { r: 9; opacity: .8; } 100% { r: 20; opacity: 0; } }

  /* ── Desktop panel ──────────────────────────────────── */
  .panel { max-width: 640px; margin: 0 auto; padding: 34px var(--pad-x) 0; }
  .panel .node-index { font-family: var(--font-ui); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; }
  .panel h2 { font-size: 1.8rem; font-weight: 400; line-height: 1.2; color: var(--text-hi); letter-spacing: -0.01em; margin-bottom: 16px; }
  .panel .thesis { font-size: 1.12rem; font-style: italic; color: var(--accent); line-height: 1.6; border-left: 2px solid var(--border-hi); padding-left: 18px; margin-bottom: 28px; }
  .panel .ideas-label { font-family: var(--font-ui); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .panel .ideas { list-style: none; margin-bottom: 30px; }
  .panel .ideas li { padding: 12px 0; border-top: 1px solid var(--border); font-size: 0.98rem; line-height: 1.7; color: var(--text); }
  .panel .ideas li:last-child { border-bottom: 1px solid var(--border); }
  .panel .ideas li .lead { color: var(--accent); font-family: var(--font-ui); font-size: 12px; margin-right: 8px; }
  .panel .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel .chips span { font-family: var(--font-ui); font-size: 12px; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 5px; }
  .panel .chip-link { font-family: var(--font-ui); font-size: 12px; color: var(--accent); background: var(--surface); border: 1px solid var(--border-hi); padding: 4px 10px; border-radius: 5px; text-decoration: none; }
  .panel .chip-link:hover { border-color: var(--accent); color: var(--text-hi); }

  /* ── Vertical timeline (mobile) ─────────────────────── */
  .vspine { max-width: 640px; margin: 0 auto; padding: 22px var(--pad-x) 8px; }
  .vspine .vnode {
    position: relative; padding: 0 0 0 30px; margin-bottom: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  }
  .vspine .vnode::before {
    content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px;
    background: repeating-linear-gradient(to bottom, var(--border-hi) 0 6px, transparent 6px 12px);
  }
  .vspine .vnode:last-child::before { display: none; }
  .vspine .vnode .hit {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 14px; background: none; border: 0; text-align: left; cursor: pointer;
    font-family: var(--font-body); color: var(--text-hi);
  }
  .vspine .vnode .dot {
    width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px;
    border: 2px solid var(--accent-dim); background: var(--surface); transition: background .2s;
  }
  .vspine .vnode .n { font-family: var(--font-ui); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; }
  .vspine .vnode .nm { font-size: 1.02rem; line-height: 1.3; }
  .vspine .vnode .sh { font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }
  .vspine .vnode .body { display: none; padding: 0 16px 16px; }
  .vspine .vnode.open .body { display: block; animation: fadeUp .25s ease both; }
  .vspine .vnode.open .dot { background: var(--accent); border-color: var(--accent); }
  .vspine .vnode.open { border-color: var(--accent-dim); }
  .vspine .body .thesis { font-style: italic; color: var(--accent); font-size: 0.98rem; line-height: 1.6; margin: 4px 0 14px; }
  .vspine .body .ideas-label { font-family: var(--font-ui); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .vspine .body .ideas { list-style: none; margin-bottom: 16px; }
  .vspine .body .ideas li { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.93rem; line-height: 1.65; color: var(--text); }
  .vspine .body .ideas li:last-child { border-bottom: 1px solid var(--border); }
  .vspine .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .vspine .chips span { font-family: var(--font-ui); font-size: 11px; color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 5px; }
  .vspine .chip-link { font-family: var(--font-ui); font-size: 11px; color: var(--accent); background: var(--bg); border: 1px solid var(--border-hi); padding: 3px 8px; border-radius: 5px; text-decoration: none; }
  .vspine .chip-link:hover { border-color: var(--accent); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Nav ────────────────────────────────────────────── */
  .map-nav { max-width: 640px; margin: 0 auto; padding: 24px var(--pad-x) 60px; display: flex; gap: 10px; align-items: center; }
  .map-nav button {
    font-family: var(--font-ui); font-size: 14px; color: var(--text);
    border: 1px solid var(--border-hi); border-radius: 6px;
    padding: 12px 18px; background: var(--bg); cursor: pointer; min-height: 46px;
    transition: all var(--dur);
  }
  .map-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .map-nav button:focus-visible, .vspine .hit:focus-visible, .node-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .map-nav button:disabled { opacity: 0.3; cursor: default; }
  .map-nav #next { margin-left: auto; }
  .map-nav .kbd { font-size: 11px; color: var(--text-dim); margin-right: 4px; }
  .map-nav .home-link { font-size: 13px; color: var(--text-dim); margin-left: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .map-nav .home-link:hover { color: var(--text-hi); }

  /* ── Layout switch ──────────────────────────────────── */
  @media (min-width: 701px) {
    .spine-wrap, .panel { display: block; }
    .vspine { display: none; }
  }
  @media (max-width: 700px) {
    .map-head h1 { font-size: 1.6rem; }
    .panel { display: none; }
    .spine-wrap { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .arc-path { animation: none; }
    .node-dot.active .pulse { animation: none; opacity: 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo"><a href="/" style="color: inherit;">David Jivan</a></div>
  <div class="topbar-url">davidjivan.net/christianity-map</div>
</div>

<div class="map-head">
  <h1>The <em>Arc</em></h1>
  <div class="sub">the intellectual history of Christianity</div>
  <div class="gold">nine stops, from <strong>storm god</strong> to <strong>cosmic Christ</strong></div>
  <div class="count" id="count"></div>
</div>

<div class="spine-wrap">
  <svg id="spine" viewBox="0 0 820 140" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The arc of Christian origins"></svg>
</div>

<div class="panel" id="panel" aria-live="polite"></div>

<div class="vspine" id="vspine"></div>

<div class="map-nav">
  <button id="prev"><span class="kbd">&#8592;</span> Previous</button>
  <button id="next">Next <span class="kbd">&#8594;</span></button>
  <a class="home-link" href="/">back to start</a>
</div>

<script src="/arc-data.js"></script>
<script>
(function() {
  "use strict";
  var NODES = window.ARC.nodes;
  var n = NODES.length;
  var current = 0;
  var W = 820, H = 140, x0 = 70, x1 = W - 70, y = 74;
  var gap = (x1 - x0) / (n - 1);
  var pts = NODES.map(function(_, i) { return { x: x0 + gap * i, y: y + (i % 2 === 0 ? 0 : 30) }; });

  function hashIndex() {
    var m = window.location.hash.match(/^#node-(\d+)$/);
    if (!m) return 0;
    var i = parseInt(m[1], 10) - 1;
    return (i >= 0 && i < n) ? i : 0;
  }

  function chipsHTML(node) {
    var html = node.chips.map(function(c) { return '<span>' + c + '</span>'; }).join('');
    if (node.roadmap) html += '<a class="chip-link" href="' + node.roadmap.url + '">' + node.roadmap.label + ' &#8594;</a>';
    return html;
  }

  function buildSpine() {
    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (var i = 1; i < n; i++) {
      var p0 = pts[i-1], p1 = pts[i], mx = (p0.x + p1.x) / 2;
      d += ' C ' + mx + ' ' + p0.y + ', ' + mx + ' ' + p1.y + ', ' + p1.x + ' ' + p1.y;
    }
    var s = '<path class="arc-path" d="' + d + '" fill="none" stroke="var(--border-hi)" stroke-width="2"/>';
    pts.forEach(function(p, i) {
      var filled = i < current, active = i === current;
      s += '<g class="node-dot' + (active ? ' active' : '') + '" data-i="' + i + '" tabindex="0" role="button" aria-label="' + NODES[i].name + '">'
        + '<circle class="pulse" cx="' + p.x + '" cy="' + p.y + '" r="9"/>'
        + '<circle class="hit" cx="' + p.x + '" cy="' + p.y + '" r="22"/>'
        + '<circle class="dot" cx="' + p.x + '" cy="' + p.y + '" r="' + (active ? 9 : 7) + '" fill="' + (active || filled ? 'var(--accent)' : 'var(--bg)') + '" stroke="var(--accent)" stroke-width="2"/>'
        + '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle">' + NODES[i].n + '</text>'
        + '</g>';
    });
    document.getElementById('spine').innerHTML = s;
    Array.prototype.forEach.call(document.querySelectorAll('.node-dot'), function(el) {
      el.addEventListener('click', function() { goto(parseInt(el.getAttribute('data-i'), 10)); });
      el.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goto(parseInt(el.getAttribute('data-i'), 10)); } });
    });
  }

  function buildPanel() {
    var node = NODES[current];
    document.getElementById('panel').innerHTML =
      '<div class="node-index">Stop ' + (current + 1) + ' — the arc</div>'
      + '<h2>' + node.name + '</h2>'
      + '<p class="thesis">' + node.thesis + '</p>'
      + '<div class="ideas-label">Big ideas</div>'
      + '<ul class="ideas">' + node.ideas.map(function(idea, i) { return '<li><span class="lead">' + (i + 1) + '.</span>' + idea + '</li>'; }).join('') + '</ul>'
      + '<div class="ideas-label">In the library</div>'
      + '<div class="chips">' + chipsHTML(node) + '</div>';
  }

  function buildVertical() {
    var wrap = document.getElementById('vspine');
    wrap.innerHTML = NODES.map(function(node, i) {
      var open = i === current;
      return '<div class="vnode' + (open ? ' open' : '') + '" data-i="' + i + '">'
        + '<button class="hit" aria-expanded="' + open + '">'
        + '<span class="dot"></span>'
        + '<span><span class="n">Stop ' + (i + 1) + '</span><br><span class="nm">' + node.name + '</span><span class="sh">' + node.short + '</span></span>'
        + '</button>'
        + '<div class="body">'
        + '<p class="thesis">' + node.thesis + '</p>'
        + '<div class="ideas-label">Big ideas</div>'
        + '<ul class="ideas">' + node.ideas.map(function(idea, j) { return '<li>' + idea + '</li>'; }).join('') + '</ul>'
        + '<div class="chips">' + chipsHTML(node) + '</div>'
        + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('.vnode'), function(v) {
      v.querySelector('.hit').addEventListener('click', function() { goto(parseInt(v.getAttribute('data-i'), 10)); });
    });
  }

  function goto(i) {
    if (i < 0 || i >= n) return;
    current = i;
    render();
  }

  function render() {
    document.getElementById('count').textContent = 'stop ' + (current + 1) + ' of ' + n;
    document.getElementById('prev').disabled = current === 0;
    document.getElementById('next').disabled = current === n - 1;
    document.getElementById('next').textContent = current === n - 1 ? 'End' : 'Next \u2192';
    buildSpine();
    buildPanel();
    buildVertical();
    window.location.hash = 'node-' + (current + 1);
  }

  document.getElementById('prev').addEventListener('click', function() { goto(current - 1); });
  document.getElementById('next').addEventListener('click', function() { goto(current + 1); });
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') goto(current - 1);
    if (e.key === 'ArrowRight') goto(current + 1);
    if (e.key === 'Home') goto(0);
    if (e.key === 'End') goto(n - 1);
  });

  current = hashIndex();
  render();
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>
