<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arc — From Storm God to Cosmic Christ | David Jivan</title>
<meta name="description" content="Thirteen chapters, five threads — a complete intellectual history of Yahweh and his transformation into the God of Christianity.">
<link rel="canonical" href="https://davidjivan.net/christianity-map">
<link rel="stylesheet" href="/style.css">
<style>
  .map-head { max-width: 820px; margin: 0 auto; padding: 40px var(--pad-x) 0; }
  .map-head h1 { font-size: 2.1rem; font-weight: 400; letter-spacing: -0.01em; color: var(--ink); }
  .map-head h1 em { font-style: italic; color: var(--brass); }
  .map-head .sub { font-family: var(--data); font-size: 13px; color: var(--mute); margin-top: 8px; letter-spacing: .02em; }
  .map-head .count { font-family: var(--data); font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 6px; }

  /* mode bar */
  .modebar { max-width: 820px; margin: 0 auto; padding: 24px var(--pad-x) 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .modebar .mode { font-family: var(--data); font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .1em; margin-right: 6px; }
  .modebar button {
    font-family: var(--data); font-size: 12.5px; color: var(--mute);
    border: 1px solid var(--line-strong); border-radius: 20px;
    padding: 8px 14px; background: var(--panel); cursor: pointer; min-height: 36px;
    transition: all var(--dur);
  }
  .modebar button.on { color: var(--bg); background: var(--brass); border-color: var(--brass); }
  .modebar button:not(.on):hover { border-color: var(--brass); color: var(--ink); }

  /* horizontal spine (desktop) */
  .spine-wrap { max-width: 900px; margin: 0 auto; padding: 26px var(--pad-x) 0; display: none; }
  .spine-wrap svg { display: block; width: 100%; height: auto; }
  .spine-wrap .arc-path { stroke-dasharray: 10 8; animation: flow 1.1s linear infinite; }
  .spine-wrap .node-dot { cursor: pointer; }
  .spine-wrap .node-dot circle.dot { transition: fill .2s, r .2s; }
  .spine-wrap .node-dot:hover circle.dot { fill: var(--brass); }
  .spine-wrap .node-dot text { font: 600 10px var(--data); fill: var(--ink); pointer-events: none; }
  .spine-wrap .node-dot .pulse { fill: none; stroke: var(--brass); stroke-width: 1.5; opacity: 0; }
  .spine-wrap .node-dot.active .pulse { opacity: 1; animation: pulse 2.2s ease-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @keyframes pulse { 0% { r: 9; opacity: .8; } 100% { r: 20; opacity: 0; } }

  /* chapter content */
  .panel { max-width: 720px; margin: 0 auto; padding: 34px var(--pad-x) 0; }
  .panel .part-index { font-family: var(--data); font-size: 12px; color: var(--brass); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
  .panel .part-period { font-family: var(--data); font-size: 12px; color: var(--mute); margin-bottom: 10px; }
  .panel h2 { font-size: 1.9rem; font-weight: 400; line-height: 1.2; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 26px; }
  .sec { margin-bottom: 26px; }
  .sec .sec-title { font-size: 1.12rem; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
  .sec .sec-body { font-size: 0.98rem; line-height: 1.75; color: var(--mute); }
  .sec .ideas { list-style: none; margin-top: 10px; }
  .sec .ideas li { padding: 9px 0 9px 18px; border-left: 1px solid var(--line-strong); margin-bottom: 2px; font-size: 0.93rem; line-height: 1.6; color: var(--mute); }
  .sec .srcs { font-family: var(--data); font-size: 11.5px; color: var(--mute); margin-top: 8px; }
  .sec .srcs b { color: var(--brass); font-weight: 600; }
  .sec .threads { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sec .tbadge {
    font-family: var(--data); font-size: 11px; color: var(--brass);
    border: 1px solid var(--line-strong); border-radius: 12px; padding: 3px 10px;
    background: var(--panel); cursor: pointer;
  }
  .sec .tbadge:hover { border-color: var(--brass); }
  .sec .q {
    margin-top: 10px; padding: 12px 16px; border-left: 2px solid var(--brass);
    background: var(--panel); font-size: 0.93rem; font-style: italic; color: var(--ink); line-height: 1.7;
  }
  .sec .q .qby { display: block; font-style: normal; font-family: var(--data); font-size: 11.5px; color: var(--brass); margin-top: 8px; }
  .deep { margin-top: 12px; }
  .deep a { font-family: var(--data); font-size: 12px; color: var(--brass); border: 1px solid var(--line-strong); border-radius: 20px; padding: 7px 14px; text-decoration: none; background: var(--panel); display: inline-block; }
  .deep a:hover { border-color: var(--brass); color: var(--ink); }

  /* thread mode */
  .thread-panel { max-width: 720px; margin: 0 auto; padding: 30px var(--pad-x) 0; }
  .thread-panel .th-name { font-size: 1.7rem; font-weight: 400; color: var(--ink); }
  .thread-panel .th-desc { font-size: 0.98rem; color: var(--mute); line-height: 1.7; margin: 8px 0 22px; }
  .thread-panel .th-part { font-family: var(--data); font-size: 12px; color: var(--brass); text-transform: uppercase; letter-spacing: .12em; margin: 22px 0 4px; }
  .thread-panel .th-note { font-size: 0.95rem; font-style: italic; color: var(--brass); line-height: 1.6; margin-bottom: 10px; }
  .thread-panel .th-sec { border-top: 1px solid var(--line); padding: 14px 0; }
  .thread-panel .th-sec .t { font-size: 1.05rem; font-weight: 500; color: var(--ink); }
  .thread-panel .th-sec .b { font-size: 0.93rem; color: var(--mute); line-height: 1.65; margin-top: 4px; }
  .thread-empty { max-width: 720px; margin: 0 auto; padding: 40px var(--pad-x); color: var(--mute); font-size: 1rem; line-height: 1.7; }

  /* mobile vertical */
  .vspine { max-width: 680px; margin: 0 auto; padding: 22px var(--pad-x) 8px; }
  .vnode {
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    margin-bottom: 12px; overflow: hidden;
  }
  .vnode .hit {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px; background: none; border: 0; text-align: left; cursor: pointer;
    font-family: var(--body); color: var(--ink); min-height: 56px;
  }
  .vnode .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; border: 2px solid var(--brass-dim); background: var(--panel); }
  .vnode .n { font-family: var(--data); font-size: 11px; color: var(--brass); letter-spacing: .08em; }
  .vnode .nm { font-size: 1rem; line-height: 1.3; display: block; }
  .vnode .pd { font-family: var(--data); font-size: 11px; color: var(--mute); }
  .vnode .body { display: none; padding: 0 16px 16px 40px; }
  .vnode.open { border-color: var(--brass-dim); }
  .vnode.open .dot { background: var(--brass); border-color: var(--brass); }
  .vnode.open .body { display: block; animation: fadeUp .25s ease both; }
  .vnode .body .sec { margin-bottom: 16px; }
  .vnode .body .sec-title { font-weight: 500; font-size: 1rem; color: var(--ink); margin-bottom: 4px; }
  .vnode .body .sec-body { font-size: 0.9rem; color: var(--mute); line-height: 1.65; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .map-nav { max-width: 680px; margin: 0 auto; padding: 20px var(--pad-x) 70px; display: flex; gap: 10px; align-items: center; }
  .map-nav button {
    font-family: var(--data); font-size: 14px; color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 6px;
    padding: 12px 18px; background: var(--bg); cursor: pointer; min-height: 46px;
    transition: all var(--dur);
  }
  .map-nav button:hover:not(:disabled) { border-color: var(--brass); color: var(--brass); }
  .map-nav button:disabled { opacity: 0.3; cursor: default; }
  .map-nav #next { margin-left: auto; }
  .map-nav a { font-size: 13px; color: var(--mute); margin-left: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .map-nav a:hover { color: var(--ink); }

  @media (min-width: 701px) { .spine-wrap { display: block; } .vspine { display: none; } }
  @media (max-width: 700px) {
    .map-head h1 { font-size: 1.6rem; }
    .panel, .thread-panel { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .arc-path { animation: none; }
    .node-dot.active .pulse { animation: none; opacity: 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo"><a href="/" style="color: inherit;">David Jivan</a></div>
  <div class="topbar-url">davidjivan.net/christianity-map</div>
</div>

<div class="map-head">
  <h1>From <em>Storm God</em> to <em>Cosmic Christ</em></h1>
  <div class="sub">A complete intellectual history of Yahweh and his transformation into the God of Christianity.</div>
  <div class="count" id="count"></div>
</div>

<div class="modebar" id="modebar"></div>

<div class="spine-wrap"><svg id="spine" viewBox="0 0 900 130" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The arc, thirteen chapters"></svg></div>

<div class="panel" id="panel" aria-live="polite"></div>
<div class="thread-panel" id="threadPanel" aria-live="polite"></div>
<div class="vspine" id="vspine"></div>

<div class="map-nav">
  <button id="prev"><span class="kbd" style="font-size:11px;color:var(--mute)">&#8592;</span> Chapter</button>
  <button id="next">Chapter <span class="kbd" style="font-size:11px;color:var(--mute)">&#8594;</span></button>
  <a href="/">back to start</a>
</div>

<script src="/arc-data.js"></script>
<script>
(function() {
  "use strict";
  var ARC = window.ARC;
  var PARTS = ARC.parts;
  var THREADS = ARC.threads;
  var n = PARTS.length;
  var mode = 'chapter';      // 'chapter' | 'thread'
  var thread = null;         // active thread id
  var current = 0;           // current part index
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 900, H = 130, x0 = 76, x1 = W - 76, y = 70;
  var gap = (x1 - x0) / (n - 1);
  var pts = PARTS.map(function(_, i) { return { x: x0 + gap * i, y: y + (i % 2 === 0 ? 0 : 26) }; });

  var VERIFIED = {};  // (retired — quotes carry their own q.verified flag)

  function hashParts() {
    var m = window.location.hash.match(/^#(chapter|thread)-([\w-]+)$/);
    if (!m) return null;
    return { kind: m[1], val: m[2] };
  }

  function deepLink(partIdx) {
    // parts 1-8: Israelite territory -> /bible; part 12: John -> /logos
    var p = PARTS[partIdx];
    if (p.id === 'part-12') return { href: '/logos', label: 'the john museum \u2192' };
    if (partIdx <= 7) return { href: '/bible', label: 'the bible deep map \u2192' };
    return null;
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function threadsHTML(tids) {
    if (!tids || !tids.length) return '';
    return '<div class="threads">' + tids.map(function(t) {
      var th = THREADS.filter(function(x) { return x.id === t; })[0];
      return '<button class="tbadge" data-thread="' + t + '">' + esc(th ? th.name : t) + '</button>';
    }).join('') + '</div>';
  }

  function quotesHTML(section) {
    if (!section.scholar_quotes || !section.scholar_quotes.length) return '';
    return section.scholar_quotes.map(function(q) {
      if (!q.verified) return '';  // gated until the verification pass clears it
      return '<div class="q">\u201C' + esc(q.quote) + '\u201D<span class="qby">\u2014 ' + esc(q.scholar) + ', ' + esc(q.source) + '</span></div>';
    }).join('');
  }

  function sectionHTML(s, compact) {
    var html = '<div class="sec"><div class="sec-title">' + esc(s.title) + '</div>'
      + '<div class="sec-body">' + esc(s.content) + '</div>';
    if (s.key_ideas && s.key_ideas.length) {
      html += '<ul class="ideas">' + s.key_ideas.map(function(k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul>';
    }
    if (s.key_sources && s.key_sources.length) {
      html += '<div class="srcs"><b>Sources:</b> ' + esc(s.key_sources.join(' \u00b7 ')) + '</div>';
    }
    html += threadsHTML(s.threads);
    if (!compact) html += quotesHTML(s);
    return html + '</div>';
  }

  function buildModebar() {
    var html = '<span class="mode">Mode</span>';
    html += '<button data-mode="chapter" class="' + (mode === 'chapter' ? 'on' : '') + '">By chapter</button>';
    html += '<button data-mode="thread" class="' + (mode === 'thread' ? 'on' : '') + '">Follow a thread</button>';
    if (mode === 'thread') {
      html += THREADS.map(function(t) {
        return '<button data-thread="' + t.id + '" class="' + (thread === t.id ? 'on' : '') + '">' + esc(t.name) + '</button>';
      }).join('');
    }
    document.getElementById('modebar').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('#modebar button'), function(b) {
      b.addEventListener('click', function() {
        if (b.getAttribute('data-mode')) { mode = b.getAttribute('data-mode'); thread = null; }
        else { thread = b.getAttribute('data-thread'); }
        render();
      });
    });
  }

  function buildSpine() {
    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (var i = 1; i < n; i++) {
      var p0 = pts[i-1], p1 = pts[i], mx = (p0.x + p1.x) / 2;
      d += ' C ' + mx + ' ' + p0.y + ', ' + mx + ' ' + p1.y + ', ' + p1.x + ' ' + p1.y;
    }
    var s = '<path class="arc-path" d="' + d + '" fill="none" stroke="var(--line-strong)" stroke-width="2"/>';
    pts.forEach(function(p, i) {
      var active = i === current;
      s += '<g class="node-dot' + (active ? ' active' : '') + '" data-i="' + i + '" tabindex="0" role="button" aria-label="' + esc(PARTS[i].title) + '">'
        + '<circle class="pulse" cx="' + p.x + '" cy="' + p.y + '" r="9"/>'
        + '<circle cx="' + p.x + '" cy="' + p.y + '" r="22" fill="transparent"/>'
        + '<circle class="dot" cx="' + p.x + '" cy="' + p.y + '" r="' + (active ? 9 : 6.5) + '" fill="' + (active || i < current ? 'var(--brass)' : 'var(--panel)') + '" stroke="var(--brass)" stroke-width="2"/>'
        + '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle">' + (i + 1) + '</text>'
        + '</g>';
    });
    document.getElementById('spine').innerHTML = s;
    Array.prototype.forEach.call(document.querySelectorAll('.node-dot'), function(el) {
      el.addEventListener('click', function() { goto(parseInt(el.getAttribute('data-i'), 10)); });
      el.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goto(parseInt(el.getAttribute('data-i'), 10)); } });
    });
  }

  function buildChapterPanel() {
    var p = PARTS[current];
    var deep = deepLink(current);
    document.getElementById('panel').innerHTML =
      '<div class="part-index">Chapter ' + (current + 1) + ' of ' + n + '</div>'
      + '<div class="part-period">' + esc(p.time_period) + '</div>'
      + '<h2>' + esc(p.title) + '</h2>'
      + p.sections.map(function(s) { return sectionHTML(s, false); }).join('')
      + (deep ? '<div class="deep"><a href="' + deep.href + '">' + deep.label + '</a></div>' : '');
    bindBadges();
  }

  function bindBadges() {
    Array.prototype.forEach.call(document.querySelectorAll('.tbadge'), function(b) {
      b.addEventListener('click', function() {
        mode = 'thread'; thread = b.getAttribute('data-thread');
        render();
      });
    });
  }

  function threadSections() {
    var out = [];
    PARTS.forEach(function(p, pi) {
      p.sections.forEach(function(s) {
        if (s.threads && s.threads.indexOf(thread) !== -1) {
          out.push({ part: p, pi: pi, section: s });
        }
      });
    });
    return out;
  }

  function buildThreadPanel() {
    var th = THREADS.filter(function(t) { return t.id === thread; })[0];
    if (!th) { document.getElementById('threadPanel').innerHTML = '<div class="thread-empty">Pick a thread to follow it through the whole arc.</div>'; return; }
    var hits = threadSections();
    var html = '<div class="th-name">' + esc(th.name) + '</div>'
      + '<div class="th-desc">' + esc(th.description) + '</div>';
    hits.forEach(function(h) {
      var note = h.section.thread_notes ? h.section.thread_notes[thread] : null;
      html += '<div class="th-part">Chapter ' + (h.pi + 1) + ' \u2014 ' + esc(h.part.title) + '</div>';
      if (note) html += '<div class="th-note">' + esc(note) + '</div>';
      html += '<div class="th-sec"><div class="t">' + esc(h.section.title) + '</div>'
        + '<div class="b">' + esc(h.section.content) + '</div></div>';
    });
    if (!hits.length) html += '<div class="thread-empty">No sections carry this thread yet.</div>';
    document.getElementById('threadPanel').innerHTML = html;
  }

  function buildVertical() {
    var wrap = document.getElementById('vspine');
    if (mode === 'thread') {
      // thread mode on mobile: flattened sections grouped by chapter
      var th = THREADS.filter(function(t) { return t.id === thread; })[0];
      if (!th) { wrap.innerHTML = ''; return; }
      var hits = threadSections();
      wrap.innerHTML = hits.map(function(h) {
        var note = h.section.thread_notes ? h.section.thread_notes[thread] : null;
        return '<div class="vnode open"><div class="hit" style="cursor:default"><span class="dot"></span>'
          + '<span><span class="n">Ch ' + (h.pi + 1) + ' \u00b7 ' + esc(th.name) + '</span><span class="nm">' + esc(h.section.title) + '</span><span class="pd">' + esc(h.part.title) + '</span></span></div>'
          + '<div class="body"><div class="sec"><div class="sec-body">' + esc(h.section.content) + '</div>'
          + (note ? '<div style="font-style:italic;color:var(--brass);margin-top:10px;font-size:.9rem">' + esc(note) + '</div>' : '')
          + '</div></div></div>';
      }).join('') || '<div class="thread-empty" style="padding:0 var(--pad-x) 0 40px">Pick a thread above.</div>';
      return;
    }
    wrap.innerHTML = PARTS.map(function(p, i) {
      var open = i === current;
      return '<div class="vnode' + (open ? ' open' : '') + '" data-i="' + i + '">'
        + '<button class="hit" aria-expanded="' + open + '">'
        + '<span class="dot"></span>'
        + '<span><span class="n">Chapter ' + (i + 1) + '</span><span class="nm">' + esc(p.title) + '</span><span class="pd">' + esc(p.time_period) + '</span></span>'
        + '</button>'
        + '<div class="body">' + p.sections.map(function(s) { return sectionHTML(s, false); }).join('') + '</div>'
        + '</div>';
    }).join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('.vnode'), function(v) {
      v.querySelector('.hit').addEventListener('click', function() { goto(parseInt(v.getAttribute('data-i'), 10)); });
    });
    bindBadges();
  }

  function goto(i) {
    if (mode !== 'chapter') return;
    if (i < 0 || i >= n) return;
    current = i;
    render();
  }

  function render() {
    document.getElementById('count').textContent = mode === 'chapter'
      ? 'chapter ' + (current + 1) + ' of ' + n + ' \u00b7 five threads run through it'
      : (thread ? 'thread: ' + (THREADS.filter(function(t){return t.id===thread;})[0]||{}).name : 'pick a thread to follow');
    document.getElementById('prev').disabled = mode !== 'chapter' || current === 0;
    document.getElementById('next').disabled = mode !== 'chapter' || current === n - 1;
    document.getElementById('prev').textContent = mode === 'chapter' ? '\u2190 Chapter' : '\u2190';
    document.getElementById('next').textContent = mode === 'chapter' ? (current === n - 1 ? 'End' : 'Chapter \u2192') : '\u2192';
    buildModebar();
    if (mode === 'chapter') {
      document.getElementById('panel').style.display = '';
      document.getElementById('threadPanel').style.display = 'none';
      document.getElementById('spine').style.display = '';
      buildSpine();
      buildChapterPanel();
    } else {
      document.getElementById('panel').style.display = 'none';
      document.getElementById('threadPanel').style.display = '';
      document.getElementById('spine').style.display = 'none';
      buildThreadPanel();
    }
    buildVertical();
    window.location.hash = mode === 'chapter' ? 'chapter-' + (current + 1) : 'thread-' + thread;
  }

  document.getElementById('prev').addEventListener('click', function() { goto(current - 1); });
  document.getElementById('next').addEventListener('click', function() { goto(current + 1); });
  document.addEventListener('keydown', function(e) {
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'BUTTON') return;
    if (e.key === 'ArrowLeft') goto(current - 1);
    if (e.key === 'ArrowRight') goto(current + 1);
    if (e.key === 'Home') goto(0);
    if (e.key === 'End') goto(n - 1);
  });

  // deep hash
  var h = hashParts();
  if (h) {
    if (h.kind === 'chapter') { mode = 'chapter'; current = Math.min(parseInt(h.val, 10) - 1, n - 1); if (current < 0) current = 0; }
    else if (h.kind === 'thread') { mode = 'thread'; thread = h.val; }
  }
  render();
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>
