<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Jivan</title>
<meta name="description" content="I am a nerd who talks about Consciousness, the Logos, early Christian theology, and other things I think about while roaming the country in a fifth wheel with my family in tow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>

:root {
  --bg:       #0f0f0f;
  --surface:  #161616;
  --border:   #272727;
  --border-hi:#3a3a3a;
  --text:     #c8c4bb;
  --text-dim: #666560;
  --text-hi:  #e8e5de;
  --accent:   #6b9e6b;
  --accent-dim: #3d5c3d;
  --font: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  --dur: 0.15s;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
button { font: inherit; border: none; background: none; cursor: pointer; }
a { text-decoration: none; color: inherit; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ─── TOPBAR ─────────────────────────────────────────────── */
.topbar {
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.topbar-logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-hi);
}

.topbar-url {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}

/* ─── HERO ──────────────────────────────────────────────── */
.hero {
  padding: 48px 24px 40px;
  border-bottom: 1px solid var(--border);
  max-width: 720px;
}

.hero-prompt {
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: 16px;
}

.hero-prompt::before { content: '> '; color: var(--text-dim); }

.hero-title {
  font-size: clamp(22px, 5vw, 32px);
  font-weight: 700;
  color: var(--text-hi);
  letter-spacing: 0.04em;
  margin-bottom: 16px;
  line-height: 1.1;
}

.cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: var(--accent);
  vertical-align: text-bottom;
  margin-left: 4px;
  animation: blink 1.2s step-end infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

.hero-sub {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
  max-width: 480px;
  font-weight: 300;
}

/* ─── MENU ──────────────────────────────────────────────── */
.menu {
  flex: 1;
  padding: 32px 24px 56px;
  max-width: 720px;
}

.menu-label {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

/* ─── POST LIST ──────────────────────────────────────────── */
.post-list { display: flex; flex-direction: column; gap: 2px; }

.post-card {
  display: block;
  padding: 14px 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: border-color var(--dur), background var(--dur);
  -webkit-tap-highlight-color: transparent;
}
.post-card:hover { border-color: var(--border-hi); background: #1c1c1c; }

.post-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-hi);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
  line-height: 1.5;
}

.post-meta {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}

/* ─── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 480px) {
  .hero { padding: 36px 20px 32px; }
  .menu { padding: 24px 20px 48px; }
}

</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">David Jivan</div>
  <div class="topbar-url">davidjivan.net</div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-prompt">thinker · nomad · writer</div>
  <div class="hero-title">David Jivan<span class="cursor"></span></div>
  <div class="hero-sub">I am a nerd who talks about Consciousness, the Logos, early Christian theology, and other things I think about while roaming the country in a fifth wheel with my family in tow</div>
</div>

<!-- POSTS -->
<div class="menu">
  <div class="menu-label">// posts</div>
  <div class="post-list" id="post-list"></div>
</div>


<script>
  fetch('/posts.json')
    .then(r => r.json())
    .then(posts => {
      document.getElementById('post-list').innerHTML = posts.map(p => {
        const meta = [p.date, ...p.tags].join(' · ');
        return `<a class="post-card" href="/posts/${p.slug}.html">
          <div class="post-title">${p.title}</div>
          <div class="post-meta">${meta}</div>
        </a>`;
      }).join('');
    });
</script>
</body>
</html>
