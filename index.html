<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Jivan</title>
<meta name="description" content="I am a nerd who talks about Consciousness, the Logos, early Christian theology, and other things I think about while roaming the country in a fifth wheel with my family in tow.">

<link rel="stylesheet" href="/style.css">
<script defer src="/track.js"></script>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">David Jivan</div>
  <div class="topbar-url">davidjivan.net</div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-prompt">thinker · nomad · writer</div>
  <div class="hero-title">David Jivan<span class="cursor"></span></div>
  <div class="hero-sub">The thing you were given doesn't work. Here's exactly why — no hedging, no mystery, just the logic. And here's what's actually on the other side.</div>
</div>

<!-- POSTS -->
<div class="menu">
  <div class="menu-label">Posts</div>
  <div class="post-list" id="post-list"></div>
</div>

<!-- READING ORDER -->
<div class="menu" style="border-top: 1px solid var(--border); padding-top: 32px;">
  <div class="menu-label">Start here</div>
  <div style="font-size: 12px; color: var(--text-dim); line-height: 1.8; font-weight: 300; margin-bottom: 16px; max-width: 520px;">If you're new, this is the thread. Each piece builds on the last.</div>
  <div class="post-list" id="reading-order"></div>
</div>

<script>
  const readingOrder = [
    { section: "The moral problem", posts: [
      { n: "1", slug: "the-god-who-would-torture-you-forever", title: "The God who would torture you forever" },
      { n: "2", slug: "why-evangelical-christianity-needs-god-to-be-a-monster", title: "Why evangelical Christianity needs God to be a monster" }
    ]},
    { section: "The textual problem", posts: [
      { n: "3", slug: "the-bible-is-the-inerrant-word-of-god", title: "The Bible is the inerrant Word of God" },
      { n: "4", slug: "your-bible-has-been-edited", title: "Your Bible has been edited" },
      { n: "5", slug: "the-man-they-burned-made-your-bible", title: "The man they burned made your Bible" },
      { n: "6", slug: "who-gives-a-fuck-about-a-johannine-comma", title: "Who gives a f*ck about a Johannine comma?" }
    ]},
    { section: "The divine command problem", posts: [
      { n: "7", slug: "the-god-who-commanded-genocide", title: "The God who commanded genocide" }
    ]},
    { section: "The double standard", posts: [
      { n: "8", slug: "cut-the-mormons-some-slack", title: "Cut the Mormons some slack!" }
    ]},
    { section: "The recovery", posts: [
      { n: "9", slug: "the-first-one-they-killed", title: "The first one they killed" },
      { n: "10", slug: "theologian-scourge-of-love-isaac-of-nineveh", title: "The theologian who said hell was the scourge of love" },
      { n: "11", slug: "does-christianity-hinge-on-the-resurrection", title: "Do you believe Jesus rose from the dead?" },
      { n: "12", slug: "there-are-no-particles", title: "There are no particles" },
      { n: "13", slug: "the-logos-lineage", title: "The Logos lineage" },
      { n: "14", slug: "the-logos-was-toward-god", title: "The Logos was toward God" },
      { n: "15", slug: "what-i-mean-when-i-say-god", title: "What I Mean When I Say \"God\"" },
      { n: "16", slug: "the-word-soul-is-a-wreck", title: "The Word \"Soul\" Is a Wreck" },
      { n: "17", slug: "the-measurement-problem", title: "The Measurement Problem" },
      { n: "18", slug: "the-god-who-didnt-have-to-fight", title: "The God who didn't have to fight" },
      { n: "19", slug: "i-dont-know-shit-about-shit", title: "I don't know shit about shit" }
    ]}
  ];

  fetch('/posts.json')
    .then(r => r.json())
    .then(posts => {
      document.getElementById('post-list').innerHTML = posts.filter(p => !p.draft).map(p => {
        const meta = [p.date, ...p.tags].join(' · ');
        return `<a class="post-card" href="/posts/${p.slug}.html">
          <div class="post-title">${p.title}</div>
          <div class="post-meta">${meta}</div>
        </a>`;
      }).join('');

      document.getElementById('reading-order').innerHTML = readingOrder.map(section => {
        const label = `<div class="menu-label" style="margin-top: 8px;">${section.section}</div>`;
        const items = section.posts.map(r => {
          return `<a class="post-card" href="/posts/${r.slug}.html">
            <div class="post-title">${r.n}. ${r.title}</div>
          </a>`;
        }).join('');
        return label + items;
      }).join('');
    });
</script>
<script src="/components.js"></script>
</body>
</html>
